[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readiness-loop"
dynamic = ["version"]
description = "An open-source agentic loop that forecasts disaster risk from public data and validates its own probabilities against history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["disaster-risk", "forecasting", "calibration", "emergency-management", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Programming Language :: Python :: 3",
]

# No runtime dependencies, deliberately. The eval plane must produce identical
# numbers from a clean clone on any machine; a dependency whose version can move
# under it defeats the Phase 0 reproducibility criterion.
dependencies = []

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.150"]
# Only for regenerating the walkthrough's screenshots (tools/demo/capture.py).
# pillow floor is a security minimum: versions before 12.2.0 are vulnerable to
# CVE-2026-42311 (PSD RCE), CVE-2026-42309 (buffer overflow) and CVE-2026-42310
# (PDF-parsing DoS) -- see GHSA-r73j-pqj5-w3x7 and related advisories.
# playwright floor is a security minimum: versions before 1.55.1 are vulnerable
# to CVE-2025-59288 (browser download skips TLS certificate verification).
docs = ["playwright>=1.63.0", "pillow>=12.3.0"]

[project.scripts]
readiness = "readiness.cli:main"

[tool.setuptools.packages.find]
include = ["readiness*"]

[tool.setuptools.dynamic]
version = { attr = "readiness.__version__" }

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# HTML templates read better as long f-string lines than as wrapped fragments.
"readiness/dashboard.py" = ["E501"]
