[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readiness-loop"
dynamic = ["version"]
description = "An open-source agentic loop that forecasts disaster risk from public data and validates its own probabilities against history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["disaster-risk", "forecasting", "calibration", "emergency-management", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Programming Language :: Python :: 3",
]

# No runtime dependencies, deliberately. The eval plane must produce identical
# numbers from a clean clone on any machine; a dependency whose version can move
# under it defeats the Phase 0 reproducibility criterion.
dependencies = []

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.150"]
# Only for regenerating the walkthrough's screenshots (tools/demo/capture.py).
# pillow floor is a security minimum: versions before 13.0.0 are vulnerable to
# CVE-2026-96639 (stale native image storage reused after mode transitions,
# GHSA-v9pv-5gc8-w2m6) and CVE-2026-112398 (FlashPix/JPEG decoder heap
# overflow), among other advisories fixed only in 13.0.0. Note 13.0.0 requires
# Python >=3.11, so this extra is no longer installable under the 3.10 leg of
# the test matrix -- harmless today since no CI job installs it, but relevant
# if that changes.
# playwright floor is a security minimum: versions before 1.55.1 are vulnerable
# to CVE-2025-59288 (browser download skips TLS certificate verification).
docs = ["playwright>=1.63.0", "pillow>=13.0.0"]

[project.scripts]
readiness = "readiness.cli:main"

[tool.setuptools.packages.find]
include = ["readiness*"]

[tool.setuptools.dynamic]
version = { attr = "readiness.__version__" }

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# HTML templates read better as long f-string lines than as wrapped fragments.
"readiness/dashboard.py" = ["E501"]
