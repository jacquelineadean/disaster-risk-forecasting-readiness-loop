# Pull real, pinned data for one contract and verify it, on demand.
#
# Nothing on `main` is written by this workflow: it snapshots and verifies in
# the runner's own checkout and uploads the result as a downloadable
# artifact. A person reviews it and commits what the run produced (an updated
# snapshots/manifest.json, a new or refreshed harness_expected/<contract>.json,
# ledger cards) themselves, the same as any other change to those files.
#
# Phases 1 and 2 run in two steps (plan §7). A rehearsal (`promote` off, the
# default) pulls the data and writes validate cards only; it spends nothing.
# The promote run spends each contract's one test touch. Its artifact is
# uploaded whatever the verdict, including when `verify` fails, because a
# touch spent in the runner and not committed is the one outcome the protocol
# cannot recover from: a second dispatch starts from a clean checkout with an
# unspent touch.

name: real-data

on:
  workflow_dispatch:
    inputs:
      contract:
        description: "Registered contract name"
        required: false
        default: "tornado-ok"
      phase:
        description: "Exit criteria to verify: 0 (baselines reproduce), 1 (the promoted test card) or 2 (the fleet, the exposure join, the brief)"
        required: false
        default: "0"
      features:
        description: "Feature connectors to pull and load, comma-separated (era5,terrain,nri,climada)"
        required: false
        default: "era5,terrain"
      period:
        description: "Phase 2 only: the period to issue, in the contract's shape (2026-Q4, 2026-M11, 2026)"
        required: false
        default: ""
      states:
        description: "Phase 2 only: states to pin USA Structures counts for, comma-separated; empty pulls every state"
        required: false
        default: ""
      promote:
        description: "Phases 1 and 2: spend the test touch. Off is a rehearsal that writes validate cards only"
        type: boolean
        required: false
        default: false
      extra_args:
        description: "Extra arguments appended to `readiness verify`"
        required: false
        default: ""

permissions:
  contents: read

# One run at a time, queued rather than cancelled: every run writes the same
# manifest and the same cache, and a cancelled promote run is a spent touch
# with no artifact.
concurrency:
  group: real-data
  cancel-in-progress: false

jobs:
  snapshot-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PROMOTE_FLAG: ${{ inputs.promote && '--promote' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Restore, and save under a key of this run's own, rather than one
      # `actions/cache` step: a cache step skips its save on an exact key hit,
      # and the site build already saves under the manifest's hash, so every
      # feature pull made here would be thrown away and an interrupted national
      # pull could never resume. The newest cache for this manifest wins, then
      # the newest of any; the pulls re-pin (or refuse) what they find. The
      # path list must stay in the same order as site.yml's: the cache
      # version is a hash of it, and a different order never restores.
      - name: Restore the pinned data
        uses: actions/cache/restore@v6
        with:
          path: |
            snapshots/census
            snapshots/nws
            snapshots/storm_events
            snapshots/open_meteo
            snapshots/fema
            snapshots/climada
            snapshots/usa_structures
          key: snapshot-${{ hashFiles('snapshots/manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            snapshot-${{ hashFiles('snapshots/manifest.json') }}
            snapshot-
      - name: Pull and pin the contract's data
        timeout-minutes: 300
        run: >
          python -m readiness.cli snapshot -c ${{ inputs.contract }}
          --features "${{ inputs.features }}"
      - name: Show the feature sources and their admission verdicts
        if: ${{ inputs.phase == '1' }}
        run: >
          python -m readiness.cli features -c ${{ inputs.contract }}
          --features "${{ inputs.features }}"
      - name: Run the Phase 1 queue (promote the first non-baseline validate pass)
        if: ${{ inputs.phase == '1' }}
        run: >
          python -m readiness.cli loop -c ${{ inputs.contract }}
          --features "${{ inputs.features }}" --queue phase1 $PROMOTE_FLAG
      - name: Write the backtest report
        if: ${{ inputs.phase == '1' }}
        run: python -m readiness.cli backtest -c ${{ inputs.contract }}
      # Phase 2 runs the fleet rather than one contract: every national contract
      # through the Phase 2 queue with promotion, then the exposure pull and its
      # spot-check, then one issued file and one brief per passing contract. The
      # spot-check and the per-contract refusals do not fail the job on their
      # own; `verify --phase 2` at the end is the gate.
      - name: Run the fleet over every national contract
        if: ${{ inputs.phase == '2' }}
        continue-on-error: true
        run: >
          python -m readiness.cli fleet --national --queue phase2 $PROMOTE_FLAG
          --features "${{ inputs.features }}"
      - name: Write every contract's backtest report
        if: ${{ inputs.phase == '2' }}
        run: |
          for c in $(python -m readiness.cli contracts --names); do
            python -m readiness.cli backtest -c "$c" || exit 1
          done
      - name: Pull and pin the USA Structures county counts
        if: ${{ inputs.phase == '2' }}
        run: |
          if [ -n "${{ inputs.states }}" ]; then
            python -m readiness.cli exposure snapshot --states "${{ inputs.states }}"
          else
            python -m readiness.cli exposure snapshot --all-states
          fi
      - name: Spot-check the exposure join against the assessor counts
        if: ${{ inputs.phase == '2' }}
        continue-on-error: true
        run: python -m readiness.cli exposure spot-check
      - name: Issue the promoted model for every passing contract
        if: ${{ inputs.phase == '2' && inputs.promote && inputs.period != '' }}
        run: >
          make issue-all PERIOD="${{ inputs.period }}"
          FEATURES="${{ inputs.features }}"
      - name: Write a brief per county of every spot-checked state
        if: ${{ inputs.phase == '2' && inputs.promote && inputs.period != '' }}
        run: make brief-all PERIOD="${{ inputs.period }}"
      # A rehearsal cannot meet Phases 1 or 2 (it writes no test card), so it
      # prints where things stand instead of failing on a verdict nobody asked
      # for.
      - name: Show where the rehearsal left the ledgers
        if: ${{ !inputs.promote && (inputs.phase == '1' || inputs.phase == '2') }}
        run: |
          if [ "${{ inputs.phase }}" = "1" ]; then
            python -m readiness.cli ledger -c "${{ inputs.contract }}"
          fi
          python -m readiness.cli fleet --status
      # Phase 2 takes no contract: its criteria are about the whole registry.
      - name: Verify the exit criteria
        if: ${{ inputs.phase == '0' || inputs.promote }}
        run: |
          if [ "${{ inputs.phase }}" = "2" ]; then
            python -m readiness.cli verify --phase 2 ${{ inputs.extra_args }}
          else
            python -m readiness.cli verify -c "${{ inputs.contract }}" \
              --phase "${{ inputs.phase }}" ${{ inputs.extra_args }}
          fi
      # Everything below runs whatever happened above (short of a cancel), so
      # a failing test card, a refused promotion or a pull that ran out of
      # time still leaves its evidence and its partial data behind.
      - name: Trim a torn last line from an interrupted ERA5 pull
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("snapshots/open_meteo").glob("*.jsonl"):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              if lines and lines[-1].strip():
                  try:
                      json.loads(lines[-1])
                  except ValueError:
                      path.write_text("".join(lines[:-1]), encoding="utf-8")
                      print(f"trimmed a torn last line from {path}")
          PY
      - name: Save the pinned data for the next run
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            snapshots/census
            snapshots/nws
            snapshots/storm_events
            snapshots/open_meteo
            snapshots/fema
            snapshots/climada
            snapshots/usa_structures
          key: snapshot-${{ hashFiles('snapshots/manifest.json') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: real-data-phase${{ inputs.phase }}-${{ inputs.phase == '2' && 'national' || inputs.contract }}-${{ inputs.promote && 'promote' || 'rehearsal' }}-${{ github.run_id }}
          path: |
            experiments
            issued
            briefs
            harness_expected
            snapshots/manifest.json
